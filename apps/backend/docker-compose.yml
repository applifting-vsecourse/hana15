# Explicit name: the project must not depend on the folder name, and must not
# collide with another clone of this starter (Togena uses `togena`, port 5433).
name: quacker

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: quacker
      POSTGRES_PASSWORD: quacker
      POSTGRES_DB: quacker
    ports:
      - 5434:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quacker -d quacker']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
